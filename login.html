<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDOPS // INTEL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#c9c9c9;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;display:flex;align-items:center;justify-content:center}
#rain{position:fixed;inset:0;z-index:0;opacity:.55}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 10%,rgba(24,0,0,.5) 52%,rgba(0,0,0,.88) 80%,#000 100%)}.vignette:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -12%,rgba(255,30,30,.12),transparent 55%)}
.box{position:relative;z-index:2;text-align:center;padding:28px;max-width:440px;width:94%}
.maskwrap{position:relative;display:inline-block;will-change:transform;z-index:2}.mask{width:185px;height:258px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,43,43,.45);animation:levitate 7s ease-in-out infinite,heartbeat 4.2s ease-in-out infinite}@keyframes heartbeat{0%,100%{filter:drop-shadow(0 0 32px rgba(255,30,30,.45)) saturate(1.05)}12%{filter:drop-shadow(0 0 58px rgba(255,30,30,.8)) saturate(1.3)}26%{filter:drop-shadow(0 0 32px rgba(255,30,30,.45)) saturate(1.05)}}.flicker{animation:flick 11s infinite}@keyframes flick{0%,92.5%,95.5%,100%{opacity:1}93.5%,94.5%{opacity:.68}}
@keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.banner{color:#ff2b2b;text-align:left;font-size:12.5px;line-height:1.75;margin:20px auto 16px;white-space:pre;display:inline-block}
.banner .dim{color:#7a1f1f}
.promptline{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.promptline .ps{color:#ff2b2b;font-size:13px}
input{background:#0a0000;border:1px solid #5a1414;color:#ffd7d7;padding:12px 14px;border-radius:6px;font-family:inherit;font-size:15px;width:200px;outline:none}
input:focus{border-color:#ff2b2b;box-shadow:0 0 12px rgba(255,43,43,.35)}
button{background:#1a0505;border:1px solid #ff2b2b;color:#ff2b2b;padding:12px 20px;border-radius:6px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px;min-height:46px}
button:hover{background:#ff2b2b;color:#000;box-shadow:0 0 18px rgba(255,43,43,.6)}
.err{color:#ff5555;font-size:12px;min-height:18px;margin-bottom:10px}
.foot{margin-top:16px;font-size:10.5px;color:#5c1a1a}
#enoch{display:block;margin:16px auto 2px;filter:drop-shadow(0 0 8px rgba(255,43,43,.5))}
.enoch-names{font-size:9.5px;color:#8a2323;letter-spacing:2.5px;margin:4px 0 0}
.term{text-align:left;font-size:11.5px;line-height:1.65;background:rgba(12,0,0,.55);border:1px solid rgba(255,43,43,.22);border-radius:8px;padding:12px 14px;margin:16px auto 4px;max-width:400px;height:178px;overflow:hidden;white-space:pre-wrap;color:#d8a0a0}
.term .p{color:#ff2b2b}.term .o{color:#7a6a6a}.term .g{color:#ff6b6b}.term .w{color:#e8c9c9}
.cursor{display:inline-block;width:7px;height:13px;background:#ff2b2b;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head>

<script>
(function(){
var c=document.getElementById('rain'),x=c.getContext('2d'),W,H,cols,drops,fs=15;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-40;}
rs();addEventListener('resize',rs);
setInterval(function(){
x.fillStyle='rgba(0,0,0,0.08)';x.fillRect(0,0,W,H);
x.font=fs+'px monospace';
for(var i=0;i<cols;i++){
var ch=Math.random()>0.5?'1':'0',r=Math.random();
x.fillStyle=r>0.92?'#ff6b6b':(r>0.75?'#e02626':'#7a1010');
x.fillText(ch,i*fs,drops[i]*fs);
if(drops[i]*fs>H&&Math.random()>0.975)drops[i]=0;
drops[i]+=0.55+Math.random()*0.5;
}},50);
})();
</script>
<script>

(function(){
var wrap=document.getElementById('maskwrap'),tx=0,ty=0,cx=0,cy=0,t=0,idle=99;
function onMove(x,y){tx=(x/window.innerWidth-0.5)*52;ty=(y/window.innerHeight-0.5)*40;idle=0;}
window.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY);});
window.addEventListener('touchmove',function(e){var th=e.touches[0];if(th)onMove(th.clientX,th.clientY);},{passive:true});
(function loop(){t+=0.016;idle+=0.016;var ix=0,iy=0;
if(idle>5){ix=Math.sin(t*0.45)*16;iy=Math.cos(t*0.33)*11;}
cx+=(tx+ix-cx)*0.055;cy+=(ty+iy-cy)*0.055;
if(wrap){wrap.style.transform='translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px) rotate('+(cx*0.05).toFixed(2)+'deg)';}
window.requestAnimationFrame(loop);})();
var G={A:[[[0,6],[2,0],[4,6]],[[1,4],[3,4]]],D:[[[0,0],[0,6]],[[0,0],[3,0],[4,2],[4,4],[3,6],[0,6]]],I:[[[1,0],[3,0]],[[2,0],[2,6]],[[1,6],[3,6]]],L:[[[0,0],[0,6],[4,6]]],O:[[[1,0],[3,0],[4,2],[4,4],[3,6],[1,6],[0,4],[0,2],[1,0]]],S:[[[4,0],[0,0],[0,3],[4,3],[4,6],[0,6]]],W:[[[0,0],[1,6],[2,2],[3,6],[4,0]]]};
var cv=document.getElementById('enoch');
if(cv){var g=cv.getContext('2d'),PH='I DO AS I WILL',s=5,ox=16,oy=11,ph=0;
(function draw(){g.clearRect(0,0,cv.width,cv.height);
var pu=0.72+0.28*Math.sin(ph+=0.035);
g.strokeStyle='rgba(255,72,72,'+(0.9*pu+0.1).toFixed(3)+')';
g.lineWidth=2;g.lineCap='round';g.lineJoin='round';
g.shadowColor='rgba(255,30,30,'+(0.85*pu).toFixed(3)+')';g.shadowBlur=13*pu;
var x=ox;
for(var i=0;i<PH.length;i++){var ch=PH.charAt(i);
if(ch===' '){x+=14;continue;}
var gl=G[ch]||[];
for(var k=0;k<gl.length;k++){var p=gl[k];g.beginPath();
g.moveTo(x+p[0][0]*s,oy+p[0][1]*s);
for(var q=1;q<p.length;q++){g.lineTo(x+p[q][0]*s,oy+p[q][1]*s);}
g.stroke();}
x+=4*s+16;}
window.requestAnimationFrame(draw);})();}
var term=document.getElementById('term');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function push(html){var d=document.createElement('div');d.innerHTML=html;term.appendChild(d);
while(term.children.length>48){term.removeChild(term.firstChild);}
term.scrollTop=term.scrollHeight;}
var LINES=[
['cmd','msf6 > ','use auxiliary/gather/redops_login'],
['out','[*] Module loaded: redops_login'],
['cmd','msf6 auxiliary(gather/redops_login) > ','show options'],
['out',''],
['out','   Name      Current Setting  Required  Description'],
['out','   ----      ---------------  --------  -----------'],
['out','   RHOSTS                     yes       Target address'],
['out','   RPORT     443              yes       Target port'],
['out',''],
['cmd','msf6 auxiliary(gather/redops_login) > ','set RHOSTS redops.local'],
['out','RHOSTS => redops.local'],
['cmd','msf6 auxiliary(gather/redops_login) > ','run'],
['out','[*] Negotiating session...'],
['out','[*] Verifying operator key...'],
['ok','[+] Session established -- awaiting passphrase'],
['out','']];
var li=0;
function play(){
if(li>=LINES.length){window.setTimeout(function(){term.innerHTML='';li=0;play();},6500);return;}
var L=LINES[li++];
if(L[0]==='cmd'){
var d=document.createElement('div');
d.innerHTML='<span class="p">'+esc(L[1])+'</span><span class="w"></span><span class="cursor"></span>';
term.appendChild(d);term.scrollTop=term.scrollHeight;
var sp=d.getElementsByClassName('w')[0],txt=L[2],ci=0;
(function tick(){if(ci<=txt.length){sp.textContent=txt.slice(0,ci);ci++;
window.setTimeout(tick,22+Math.random()*48);}else{
var cu=d.getElementsByClassName('cursor')[0];if(cu){cu.parentNode.removeChild(cu);}
window.setTimeout(play,430);}})();
}else{window.setTimeout(function(){
push('<span class="'+(L[0]==='ok'?'g':'o')+'">'+esc(L[1])+'</span>');
window.setTimeout(play,L[0]==='ok'?1000:300);},L[0]==='ok'?750:360);}}
if(term){play();}
})();

</script>
